name: Manual Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Armbian Image
        run: |
          sudo ./compile.sh \
            BOARD=orangepi4 \
            BRANCH=current \
            RELEASE=bookworm \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,gpg,img \
            EXPERT=yes

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Armbian-OrangePi4Pro-Image
          path: output/images/*.img*
